<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理面板 | 家务AI管家</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.aw{max-width:960px;margin:0 auto;padding:24px}
.aw h2{font-size:18px;margin:24px 0 12px}
.sr{display:flex;gap:16px;margin-bottom:24px}
.sb{flex:1;background:#fff;border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sb .n{font-size:28px;font-weight:700;color:#5B6ABF}
.sb .l{font-size:12px;color:#8F97B0;margin-top:4px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;border-radius:8px;margin-bottom:4px;border:1px solid #EEF0F4;font-size:13px}
.tt{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.tt.l{background:#ECF2F8;color:#5B8FBF}.tt.t{background:#4A9E8E;color:#fff}
.tt.f{background:#EDF6F1;color:#52A879}.tt.e{background:#FBEEEE;color:#C45C5C}
.td{flex:1;color:#5A6380;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:#8F97B0;white-space:nowrap}
.eh{color:#8F97B0;text-align:center;padding:32px}
.sc{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #EEF0F4}
th{color:#8F97B0;font-weight:500;font-size:11px}
</style></head>
<body>
<nav class="topbar">
<div class="logo">🏠 家务AI管家 <span class="version-tag">v5.2</span></div>
<div class="nav-links">
<a href="/app" class="nav-link">💬 对话</a>
<a href="/admin" class="nav-link active">🛠 管理</a>
<a href="/dashboard" class="nav-link">⚙ 工作台</a>
</div>
</nav>
<div class="aw">
<h2>📊 用量概览</h2>
<div class="sr" id="sr">
<div class="sb"><div class="n" id="ttt">-</div><div class="l">7日Token</div></div>
<div class="sb"><div class="n" id="ttc">-</div><div class="l">费用CNY</div></div>
<div class="sb"><div class="n" id="tca">-</div><div class="l">API调用</div></div>
<div class="sb"><div class="n" id="tsf">-</div><div class="l">满意度</div></div>
</div>
<h2>🧠 执行追踪</h2>
<div class="sc">
<select id="ses" style="width:100%;border:1px solid #E2E5EB;border-radius:6px;padding:8px;font-size:13px" onchange="lt(this.value)"><option value="">选择对话查看追踪</option></select>
<div id="trd" style="margin-top:12px"><p class="eh">选择对话查看Agent完整思考链路</p></div>
</div>
<h2>👍 反馈记录</h2>
<div class="sc" id="fbs"><p class="eh">加载中</p></div>
<h2>📈 Token趋势(7天)</h2>
<div class="sc" id="trs"><p class="eh">加载中</p></div>
</div>
<script src="/static/admin.js"></script>
</body></html>
