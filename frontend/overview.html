<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭总览驾驶舱 — 家务AI管家 v5.0</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); padding: var(--space-lg); max-width: 1300px; margin: 0 auto; }
        .overview-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-lg);
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
            transition: all var(--transition); cursor: pointer;
        }
        .overview-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .overview-card .ov-header { display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md); }
        .overview-card .ov-icon { width: 48px; height: 48px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .overview-card .ov-title { font-size: var(--fs-h3); font-weight: 600; }
        .overview-card .ov-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-bottom: var(--space-md); }
        .ov-metric { padding: var(--space-sm); background: var(--surface-alt); border-radius: var(--radius-sm); }
        .ov-metric .ov-value { font-size: 20px; font-weight: 700; }
        .ov-metric .ov-label { font-size: var(--fs-xs); color: var(--text-tertiary); }
        .overview-card .ov-actions { display: flex; gap: var(--space-sm); }
        .ov-action-btn {
            flex: 1; padding: var(--space-sm); border-radius: var(--radius); font-size: var(--fs-sm);
            font-weight: 600; text-align: center; transition: all var(--transition);
            background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border-light);
        }
        .ov-action-btn:hover { background: var(--primary-light); color: var(--primary); }
        .overview-header { padding: var(--space-lg) var(--space-lg) 0; max-width: 1300px; margin: 0 auto; }
        .overview-header .h1 { display: flex; align-items: center; gap: var(--space-sm); }
        .overview-stats { display: flex; gap: var(--space-lg); margin-top: var(--space-md); }
        .ov-stat { padding: var(--space-sm) var(--space-md); background: var(--surface); border-radius: var(--radius); font-size: var(--fs-sm); border: 1px solid var(--border-light); }
        .ov-stat strong { color: var(--primary); }
        @media (max-width: 900px) { .overview-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 640px) { .overview-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="logo">🏠 家务AI管家 <span class="version-tag">v5.0</span></div>
        <div class="nav-links">
            <a href="/overview" class="nav-link active">🏰 总览驾驶舱</a>
            <a href="/app" class="nav-link">💬 对话中枢</a>
            <a href="/dashboard" class="nav-link">⚡ 自动化工作台</a>
            <a href="/memory" class="nav-link">🕸️ 家庭记忆库</a>
            <a href="/recommend" class="nav-link">🧠 智能体选型</a>
        </div>
        <div class="nav-right">
            <a href="/profile" class="topbar-btn">👥 家庭成员画像</a>
        </div>
    </nav>

    <div class="overview-header">
        <div class="h1">🏰 家庭总览驾驶舱 <span style="font-size:var(--fs-sm);font-weight:400;color:var(--text-tertiary)">全局主Agent · 实时快照</span></div>
        <div class="overview-stats">
            <div class="ov-stat">🟢 系统正常 · <strong id="uptime">--</strong></div>
            <div class="ov-stat">📊 今日交互 <strong id="todayCount">--</strong> 次</div>
            <div class="ov-stat">⏳ 活跃任务 <strong id="activeTasks">--</strong></div>
        </div>
    </div>

    <div class="overview-grid" id="overviewGrid">
        <!-- JS renders 6 agent cards + 1 system card -->
    </div>

    <script>
    const AGENTS_CONFIG = [
        { id:'shopping', name:'购物管家', icon:'🛒', color:'#D4954A', bg:'#FBF3E9', metrics:[['冰箱食材','-- 种'],['待购清单','-- 项']], link:'/app?agent=shopping' },
        { id:'meal', name:'膳食规划师', icon:'🍳', color:'#52A879', bg:'#EDF6F1', metrics:[['本周菜谱','-- 道'],['营养评分','-- /100']], link:'/app?agent=meal' },
        { id:'appliance', name:'家电调度员', icon:'⚡', color:'#5B7FBF', bg:'#ECF2F8', metrics:[['在线设备','-- 台'],['本月省电','-- kWh']], link:'/app?agent=appliance' },
        { id:'maintenance', name:'维保小卫士', icon:'🔧', color:'#C47A5C', bg:'#FBF0EB', metrics:[['待维保','-- 项'],['待缴账单','-- 笔']], link:'/app?agent=maintenance' },
        { id:'security', name:'安防监护Agent', icon:'🛡️', color:'#7B6BBF', bg:'#F1EEF8', metrics:[['安防状态','正常'],['今日事件','-- 条']], link:'/app?agent=security' },
        { id:'household', name:'家庭事务Agent', icon:'📋', color:'#4A9E8E', bg:'#EAF5F2', metrics:[['今日日程','-- 项'],['在途快递','-- 件']], link:'/app?agent=household' },
    ];

    let agentHighlights = {};

    async function loadOverviewData() {
        try {
            const resp = await fetch('/api/v1/household/overview/user_001');
            const data = await resp.json();
            document.getElementById('uptime').textContent = data.uptime || '运行中';
            document.getElementById('todayCount').textContent = data.today_interactions || 0;
            document.getElementById('activeTasks').textContent = data.active_tasks || 0;
            if (data.agents) {
                agentHighlights = data.agents;
            }
        } catch(e) {
            console.log('Overview API unavailable, using defaults');
        }
        renderOverview();
    }

    function renderOverview() {
        const grid = document.getElementById('overviewGrid');
        grid.innerHTML = AGENTS_CONFIG.map(a => {
            let metrics = a.metrics;
            // Update metrics with real data if available
            if (agentHighlights[a.id] && agentHighlights[a.id].highlights) {
                const highlights = agentHighlights[a.id].highlights;
                const metricKeys = {
                    shopping: ['冰箱食材', '待购清单'],
                    meal: ['本周菜谱', '营养评分'],
                    appliance: ['在线设备', '本月省电'],
                    maintenance: ['待维保', '待缴账单'],
                    security: ['安防状态', '今日事件'],
                    household: ['今日日程', '在途快递']
                };
                const keys = metricKeys[a.id] || [];
                if (highlights.length >= 2) {
                    metrics = [[keys[0] || '状态', highlights[0]], [keys[1] || '信息', highlights[1]]];
                } else if (highlights.length === 1) {
                    metrics = [[keys[0] || '状态', highlights[0]], [keys[1] || '信息', '--']];
                }
            }
            const statusIcon = agentHighlights[a.id] && agentHighlights[a.id].status === 'ready' ? '🟢' : '🟡';
            return '<div class="overview-card" onclick="location.href=\'' + a.link + '\'">' +
            '<div class="ov-header">' +
            '<div class="ov-icon" style="background:' + a.bg + ';color:' + a.color + '">' + a.icon + '</div>' +
            '<div class="ov-title">' + a.name + ' <span style="font-size:10px">' + statusIcon + '</span></div>' +
            '</div>' +
            '<div class="ov-metrics">' +
            metrics.map(m => '<div class="ov-metric"><div class="ov-value">' + m[1] + '</div><div class="ov-label">' + m[0] + '</div></div>').join('') +
            '</div>' +
            '<div class="ov-actions">' +
            '<a href="' + a.link + '" class="ov-action-btn">💬 对话控制</a>' +
            '<a href="/dashboard" class="ov-action-btn">⚡ 自动化</a>' +
            '</div>' +
            '</div>';
        }).join('') +
        '<div class="overview-card" style="border:2px dashed var(--border)">' +
        '<div class="ov-header"><div class="ov-icon" style="background:var(--primary-light);color:var(--primary)">⚙️</div><div class="ov-title">系统状态</div></div>' +
        '<div class="ov-metrics">' +
        '<div class="ov-metric"><div class="ov-value" style="color:var(--success)">正常</div><div class="ov-label">LLM服务</div></div>' +
        '<div class="ov-metric"><div class="ov-value" style="color:var(--success)">正常</div><div class="ov-label">向量检索</div></div>' +
        '<div class="ov-metric"><div class="ov-value">BGE-M3</div><div class="ov-label">嵌入模型</div></div>' +
        '<div class="ov-metric"><div class="ov-value">本地</div><div class="ov-label">数据模式</div></div>' +
        '</div>' +
        '<div class="ov-actions"><a href="/docs" class="ov-action-btn">📖 API文档</a><a href="/database" class="ov-action-btn">🗄️ 数据库</a></div>' +
        '</div>';
    }

    document.addEventListener('DOMContentLoaded', () => { loadOverviewData(); });
    setInterval(loadOverviewData, 60000); // Refresh every 60s
    </script>
</body>
</html>
