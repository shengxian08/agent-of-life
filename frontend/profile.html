<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭成员画像 — 家务AI管家 v5.0</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .profile-container { max-width: 1300px; margin: 0 auto; padding: var(--space-lg); }
        .profile-header { margin-bottom: var(--space-lg); display: flex; align-items: center; gap: var(--space-lg); }
        .profile-header .h1 { flex: 1; }
        .profile-add-btn { padding: 8px 20px; border-radius: var(--radius); background: var(--primary); color: #fff; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; border: none; transition: all var(--transition); }
        .profile-add-btn:hover { background: var(--primary-dark); }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-lg); }
        .profile-card {
            background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light); overflow: hidden; transition: all var(--transition);
        }
        .profile-card:hover { box-shadow: var(--shadow-md); }
        .profile-card .pf-banner { height: 64px; position: relative; }
        .profile-card .pf-avatar {
            width: 64px; height: 64px; border-radius: 50%; position: absolute;
            bottom: -32px; left: var(--space-lg); border: 3px solid #fff; box-shadow: var(--shadow-sm);
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        .profile-card .pf-body { padding: 40px var(--space-lg) var(--space-lg); }
        .profile-card .pf-name { font-size: var(--fs-h2); font-weight: 600; margin-bottom: 4px; }
        .profile-card .pf-role { font-size: var(--fs-sm); color: var(--text-tertiary); margin-bottom: var(--space-md); }
        .profile-card .pf-section { margin-bottom: var(--space-md); }
        .profile-card .pf-label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: var(--space-xs); }
        .pf-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .pf-tag { padding: 3px 10px; border-radius: var(--radius-full); font-size: var(--fs-xs); background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border-light); }
        .pf-tag.editable { cursor: pointer; }
        .pf-slider-row { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: 4px; }
        .pf-slider-row span { font-size: var(--fs-xs); color: var(--text-secondary); min-width: 70px; }
        .pf-slider-row input[type=range] { flex: 1; accent-color: var(--primary); height: 4px; }
        .pf-slider-row .pf-val { font-size: var(--fs-xs); font-weight: 600; color: var(--primary); min-width: 36px; text-align: right; }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="logo">🏠 家务AI管家 <span class="version-tag">v5.0</span></div>
        <div class="nav-links">
            <a href="/overview" class="nav-link">🏰 总览驾驶舱</a>
            <a href="/app" class="nav-link">💬 对话中枢</a>
            <a href="/dashboard" class="nav-link">⚡ 自动化工作台</a>
            <a href="/memory" class="nav-link">🕸️ 家庭记忆库</a>
            <a href="/recommend" class="nav-link">🧠 智能体选型</a>
        </div>
        <div class="nav-right">
            <a href="/profile" class="nav-link active" style="margin-left:0">👥 家庭成员画像</a>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="h1">👥 家庭成员画像 <span style="font-size:var(--fs-sm);font-weight:400;color:var(--text-tertiary)">个性化偏好参数 · AI行为适配</span></div>
            <button class="profile-add-btn" onclick="alert('添加成员功能接入中')">+ 添加成员</button>
        </div>
        <div class="profile-grid" id="profileGrid">
            <!-- JS renders -->
        </div>
    </div>

    <script>
    const FALLBACK_MEMBERS = [
        {
            id: 'user_001', name: '我', role: '户主', icon: '👤', color: '#5B6ABF',
            diet: ['低盐', '偏好海鲜', '不吃香菜'], schedule: '工作日7:00起 / 23:00睡',
            preferences: { wake_time: 70, temp_cool: 60, light_bright: 50, music_style: 40, clean_freq: 80 }
        },
        {
            id: 'user_002', name: '配偶', role: '家庭成员', icon: '👩', color: '#C47A5C',
            diet: ['素食倾向', '喜欢烘焙', '低脂'], schedule: '工作日7:30起 / 22:30睡',
            preferences: { wake_time: 65, temp_cool: 55, light_bright: 45, music_style: 80, clean_freq: 60 }
        },
        {
            id: 'user_003', name: '孩子', role: '家庭成员', icon: '👶', color: '#52A879',
            diet: ['高蛋白', '少辣', '喜欢水果'], schedule: '上学日7:00起 / 21:00睡',
            preferences: { wake_time: 68, temp_cool: 50, light_bright: 70, music_style: 55, clean_freq: 40 }
        },
        {
            id: 'user_004', name: '老人', role: '长辈', icon: '👴', color: '#D4954A',
            diet: ['少油少盐', '软食', '糖尿病饮食'], schedule: '6:00起 / 21:00睡',
            preferences: { wake_time: 85, temp_cool: 75, light_bright: 60, music_style: 30, clean_freq: 50 }
        }
    ];
    let MEMBERS = [];

    const PREF_LABELS = {
        wake_time: '早起偏好', temp_cool: '凉爽温度', light_bright: '灯光亮度',
        music_style: '音乐偏好', clean_freq: '清洁频率'
    };

    function renderProfiles() {
        const grid = document.getElementById('profileGrid');
        grid.innerHTML = MEMBERS.map(m =>
            '<div class="profile-card">' +
            '<div class="pf-banner" style="background:linear-gradient(135deg,' + m.color + '20,' + m.color + '08)"></div>' +
            '<div class="pf-avatar" style="background:' + m.color + '15">' + m.icon + '</div>' +
            '<div class="pf-body">' +
            '<div class="pf-name">' + m.name + '</div>' +
            '<div class="pf-role">' + m.role + '</div>' +
            '<div class="pf-section">' +
            '<div class="pf-label">🍽️ 饮食偏好</div>' +
            '<div class="pf-tags">' + m.diet.map(d => '<span class="pf-tag editable">' + d + '</span>').join('') + '<span class="pf-tag editable" style="border-style:dashed;color:var(--text-tertiary)">+ 添加</span></div>' +
            '</div>' +
            '<div class="pf-section">' +
            '<div class="pf-label">🕐 作息规律</div>' +
            '<div class="pf-tags"><span class="pf-tag">' + m.schedule + '</span></div>' +
            '</div>' +
            '<div class="pf-section">' +
            '<div class="pf-label">⚙️ 个性化参数</div>' +
            Object.entries(m.preferences).map(([k, v]) =>
                '<div class="pf-slider-row"><span>' + (PREF_LABELS[k] || k) + '</span><input type="range" min="0" max="100" value="' + v + '" oninput="this.nextElementSibling.textContent=this.value"><span class="pf-val">' + v + '</span></div>'
            ).join('') +
            '</div>' +
            '</div></div>'
        ).join('');
    }

    async function loadMembers() {
        try {
            const resp = await fetch('/api/v1/household/members/user_001');
            const data = await resp.json();
            if (data.members && data.members.length > 0) {
                MEMBERS = data.members.map(function(m) {
                    return {
                        id: m.member_id, name: m.name,
                        role: m.role === 'owner' ? '户主' : m.role === 'elder' ? '长辈' : m.role === 'child' ? '孩子' : '家庭成员',
                        icon: m.avatar || '👤',
                        color: m.role === 'owner' ? '#5B6ABF' : m.role === 'elder' ? '#D4954A' : m.role === 'child' ? '#52A879' : '#C47A5C',
                        diet: m.dietary_preferences || [],
                        schedule: m.schedule_pattern || '',
                        preferences: m.preferences || {}
                    };
                });
                renderProfiles();
                return;
            }
        } catch (e) {
            console.log('Members API unavailable, using defaults');
        }
        MEMBERS = FALLBACK_MEMBERS;
        renderProfiles();
    }

    document.addEventListener('DOMContentLoaded', loadMembers);

    // Editable tags
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('pf-tag') && e.target.classList.contains('editable') && !e.target.textContent.startsWith('+')) {
            const newVal = prompt('修改偏好:', e.target.textContent);
            if (newVal && newVal.trim()) e.target.textContent = newVal.trim();
        }
    });
    </script>
</body>
</html>
