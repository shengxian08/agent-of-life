# 生产环境部署 — 单机全栈
# 用法: docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: agent-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agent2026}
      - POSTGRES_DB=household
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-app
    ports:
      - "80:8000"
    volumes:
      - app_data:/app/backend/data
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-agent2026}@db:5432/household
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-chat}
      - EMBEDDING_MODEL_NAME=./data/models/bge-m3-local
      - EMBEDDING_DEVICE=cpu
      - USE_RERANKER=false
      - RETRIEVAL_USE_HYDE=true
      - CORS_ALLOWED_ORIGINS=*
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  app_data:
